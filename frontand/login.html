<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BestBuddy - Login</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

    <div class="bg-white w-full max-w-md rounded-xl shadow-lg overflow-hidden">

        <!-- Cabeçalho -->
        <div class="bg-teal-200 py-6 border-b">
            <h1 class="text-4xl font-bold text-center text-gray-800">
                BEST BUDDY
            </h1>
        </div>

        <!-- Conteúdo -->
        <div class="p-8">

            <h2 class="text-2xl font-bold text-teal-600 mb-6">
                Entrar
            </h2>

            <!-- IMPORTANTE: id="loginForm" -->
            <form id="loginForm">

                <div class="mb-4">
                    <label class="block mb-1 font-semibold">
                        Email
                    </label>

                    <!-- IMPORTANTE: id="email" -->
                    <input
                        id="email"
                        type="email"
                        class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-teal-500"
                        placeholder="Digite seu email">
                </div>

                <div class="mb-2">
                    <label class="block mb-1 font-semibold">
                        Senha
                    </label>

                    <!-- IMPORTANTE: id="password" -->
                    <input
                        id="password"
                        type="password"
                        class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-teal-500"
                        placeholder="Digite sua senha">
                </div>

                <div class="text-right mb-6">
                    <a href="recuperarSenha.html"
                        class="text-sm text-teal-600 hover:underline">
                        Esqueci minha senha
                    </a>
                </div>

                <button
                    type="submit"
                    class="w-full bg-teal-500 hover:bg-teal-600 text-white font-bold py-3 rounded-lg transition">

                    Entrar

                </button>

            </form>

            <div class="text-center mt-6">

                <p class="text-gray-600">
                    Ainda não possui uma conta?
                </p>

                <a
                    href="cadastro.html"
                    class="text-teal-600 font-semibold hover:underline">

                    Criar Conta

                </a>

            </div>

        </div>

    </div>

    <!-- IMPORTANTE -->
<script src="js/app.js"></script>

</body>

</html>
