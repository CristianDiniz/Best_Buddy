<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BestBuddy - Cadastro ONG</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center py-10">

    <div class="bg-white w-full max-w-2xl rounded-xl shadow-lg overflow-hidden">

        <!-- Cabeçalho -->
        <div class="bg-teal-200 py-6 border-b">
            <h1 class="text-4xl font-bold text-center text-gray-800">
                BEST BUDDY
            </h1>
        </div>

        <!-- Conteúdo -->
        <div class="p-8">

            <h2 class="text-2xl font-bold text-teal-600 mb-6">
                Cadastro ONG
            </h2>

            <form>

                <!-- Dados da ONG -->
                <h3 class="text-lg font-bold text-gray-700 mb-4">
                    Dados da ONG
                </h3>

                <div class="mb-4">
                    <label class="block mb-1 font-semibold">
                        Email
                    </label>

                    <input
                        type="email"
                        class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-teal-500"
                        placeholder="Digite o email">
                </div>

                <div class="mb-4">
                    <label class="block mb-1 font-semibold">
                        CNPJ
                    </label>

                    <input
                        type="text"
                        class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-teal-500"
                        placeholder="00.000.000/0000-00">
                </div>

                <div class="mb-6">
                    <label class="block mb-1 font-semibold">
                        Telefone
                    </label>

                    <input
                        type="text"
                        class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-teal-500"
                        placeholder="(11) 99999-9999">
                </div>

                <!-- Dados da Empresa -->
                <h3 class="text-lg font-bold text-gray-700 mb-4">
                    Dados da Empresa
                </h3>

                <div class="mb-4">
                    <label class="block mb-1 font-semibold">
                        Razão Social
                    </label>

                    <input
                        type="text"
                        class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-teal-500">
                </div>

                <div class="mb-4">
                    <label class="block mb-1 font-semibold">
                        Nome Fantasia
                    </label>

                    <input
                        type="text"
                        class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-teal-500">
                </div>

                <div class="mb-4">
                    <label class="block mb-1 font-semibold">
                        CNAE Principal
                    </label>

                    <input
                        type="text"
                        class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-teal-500">
                </div>

                <div class="mb-6">
                    <label class="block mb-1 font-semibold">
                        Situação Cadastral
                    </label>

                    <input
                        type="text"
                        class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-teal-500">
                </div>

                <!-- Endereço -->
                <h3 class="text-lg font-bold text-gray-700 mb-4">
                    Endereço
                </h3>

                <div class="mb-4">
                    <label class="block mb-1 font-semibold">
                        CEP
                    </label>

                    <input
                        type="text"
                        class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-teal-500">
                </div>

                <div class="mb-4">
                    <label class="block mb-1 font-semibold">
                        Rua
                    </label>

                    <input
                        type="text"
                        class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-teal-500">
                </div>

                <div class="mb-4">
                    <label class="block mb-1 font-semibold">
                        Número
                    </label>

                    <input
                        type="text"
                        class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-teal-500">
                </div>

                <div class="mb-4">
                    <label class="block mb-1 font-semibold">
                        Bairro
                    </label>

                    <input
                        type="text"
                        class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-teal-500">
                </div>

                <div class="mb-4">
                    <label class="block mb-1 font-semibold">
                        Cidade
                    </label>

                    <input
                        type="text"
                        class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-teal-500">
                </div>

                <div class="mb-6">
                    <label class="block mb-1 font-semibold">
                        Estado
                    </label>

                    <input
                        type="text"
                        class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-teal-500">
                </div>

                <!-- Segurança -->
                <h3 class="text-lg font-bold text-gray-700 mb-4">
                    Segurança
                </h3>

                <div class="mb-4">
                    <label class="block mb-1 font-semibold">
                        Senha
                    </label>

                    <input
                        type="password"
                        class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-teal-500">
                </div>

                <div class="mb-6">
                    <label class="block mb-1 font-semibold">
                        Confirmar Senha
                    </label>

                    <input
                        type="password"
                        class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-teal-500">
                </div>

                <button
                    type="submit"
                    class="w-full bg-teal-500 hover:bg-teal-600 text-white font-bold py-3 rounded-lg transition">
                    Criar Conta
                </button>

            </form>

            <div class="text-center mt-6">
                <p class="text-gray-600">
                    Já possui uma conta?
                </p>

                <a
                    href="login.html"
                    class="text-teal-600 font-semibold hover:underline">
                    Entrar
                </a>
            </div>

        </div>

    </div>

</body>

</html>
