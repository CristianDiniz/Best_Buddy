<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Best Buddy — Solicitar adoção</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="../../css/tailwind.build.css" />
</head>
<body>
  <div class="bb-shell">
    <div id="bb-nav"></div>

    <main class="bb-main">
      <div class="bb-container max-w-[720px]">
        <h1 class="bb-page-title">Preencha os dados para solicitar a adoção</h1>

        <div id="bb-animal-summary"></div>

        <div id="bb-form-alert"></div>

        <form id="bb-adoption-form" class="bb-card" novalidate>
          <h2 class="bb-section-title">Seus dados</h2>
          <div class="bb-field">
            <label class="bb-label" for="nome">Nome</label>
            <input class="bb-input" type="text" id="nome" required />
            <div class="bb-error-text" id="nome-error"></div>
          </div>
          <div class="bb-field">
            <label class="bb-label" for="email">Email</label>
            <input class="bb-input" type="email" id="email" required />
            <div class="bb-error-text" id="email-error"></div>
          </div>
          <div class="bb-field">
            <label class="bb-label" for="telefone">Telefone</label>
            <input class="bb-input" type="tel" id="telefone" required />
            <div class="bb-error-text" id="telefone-error"></div>
          </div>

          <h2 class="bb-section-title mt-6">Sobre você</h2>

          <div class="bb-field">
            <label class="bb-label">Já teve animais de estimação antes?</label>
            <div class="bb-radio-group">
              <label class="bb-radio-option"><input type="radio" name="ja_teve" value="Sim" /> Sim</label>
              <label class="bb-radio-option"><input type="radio" name="ja_teve" value="Não" /> Não</label>
              <label class="bb-radio-option"><input type="radio" name="ja_teve" value="Não sei" /> Não sei</label>
            </div>
          </div>

          <div class="bb-field">
            <label class="bb-label">Já foi vacinado alguma vez?</label>
            <div class="bb-radio-group">
              <label class="bb-radio-option"><input type="radio" name="ja_vacinado" value="Sim" /> Sim</label>
              <label class="bb-radio-option"><input type="radio" name="ja_vacinado" value="Não" /> Não</label>
              <label class="bb-radio-option"><input type="radio" name="ja_vacinado" value="Não sei" /> Não sei</label>
            </div>
          </div>

          <div class="bb-field">
            <label class="bb-label" for="motivacao">Conte-nos um pouco sobre você e sua rotina</label>
            <textarea class="bb-textarea" id="motivacao" rows="4"
              placeholder="Por que você quer adotar, como é sua rotina, se há outros animais, crianças, etc."></textarea>
            <div class="bb-error-text" id="motivacao-error"></div>
          </div>

          <button class="bb-btn bb-btn--primary bb-btn--block" type="submit" id="bb-submit-btn">
            Finalizar solicitação
          </button>
        </form>
      </div>
    </main>

    <div id="bb-footer"></div>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/utils/storage.js"></script>
  <script src="../../js/utils/auth-guard.js"></script>
  <script src="../../js/utils/validation.js"></script>
  <script src="../../js/mocks/mock-utils.js"></script>
  <script src="../../js/mocks/mock-data.js"></script>
  <script src="../../js/api/client.js"></script>
  <script src="../../js/services/animalService.js"></script>
  <script src="../../js/services/adoptionService.js"></script>
  <script src="../../js/components/Navigation.js"></script>
  <script src="../../js/components/Footer.js"></script>
  <script src="../../js/components/StateView.js"></script>
  <script src="../../js/pages/adoption.js"></script>
</body>
</html>
