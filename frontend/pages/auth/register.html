<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Best Buddy — Criar conta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="../../css/tailwind.build.css" />
</head>
<body class="overflow-x-hidden">
  <div class="bb-auth-shell">
    <!-- Vídeo em Background em Loop -->
    <div class="bb-auth-video-bg" aria-hidden="true">
      <video class="bb-auth-video" autoplay loop muted playsinline preload="auto">
        <source src="../../assets/images/videoAnimesLogin.mp4" type="video/mp4" />
      </video>
      <div class="bb-auth-video-overlay"></div>
    </div>

    <!-- Header com Logo Arredondado -->
    <div id="bb-header" class="relative z-10 w-full"></div>

    <!-- Conteúdo Centralizado / Pop-up do Formulário -->
    <main class="bb-container flex justify-center items-center flex-1 relative z-10 my-auto py-6">
      <div class="bb-card bb-auth-card">
        <h1 class="bb-auth-subtitle">Crie sua conta</h1>
        <p class="bb-section-title text-sm text-ink-300 mb-4">Dados pessoais</p>

        <div id="bb-form-alert"></div>

        <form id="bb-register-form" novalidate>
          <div class="bb-field">
            <label class="bb-label" for="nome">Nome</label>
            <input class="bb-input" type="text" id="nome" name="nome" placeholder="Nome completo" required />
            <div class="bb-error-text" id="nome-error"></div>
          </div>

          <div class="bb-field">
            <label class="bb-label" for="email">Email</label>
            <input class="bb-input" type="email" id="email" name="email" placeholder="seu@email.com" required />
            <div class="bb-error-text" id="email-error"></div>
          </div>

          <div class="bb-field">
            <label class="bb-label" for="telefone">Telefone (opcional)</label>
            <input class="bb-input" type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" />
            <div class="bb-error-text" id="telefone-error"></div>
          </div>

          <div class="bb-field">
            <label class="bb-label" for="senha">Senha</label>
            <input class="bb-input" type="password" id="senha" name="senha" placeholder="Mínimo 6 caracteres" required />
            <div class="bb-error-text" id="senha-error"></div>
          </div>

          <div class="bb-field">
            <label class="bb-label" for="confirmar-senha">Confirmar senha</label>
            <input class="bb-input" type="password" id="confirmar-senha" name="confirmar_senha" placeholder="Repita a senha" required />
            <div class="bb-error-text" id="confirmar-senha-error"></div>
          </div>

          <button class="bb-btn bb-btn--primary bb-btn--block" type="submit" id="bb-submit-btn">
            Criar conta
          </button>
        </form>

        <div class="bb-auth-footer-link">
          <a href="login.html">Já tenho uma conta</a>
        </div>
      </div>
    </main>

    <footer class="bb-auth-footer-simple">
      © Best Buddy — Todos os direitos reservados
    </footer>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/utils/storage.js"></script>
  <script src="../../js/utils/validation.js"></script>
  <script src="../../js/mocks/mock-utils.js"></script>
  <script src="../../js/mocks/mock-data.js"></script>
  <script src="../../js/api/client.js"></script>
  <script src="../../js/services/authService.js"></script>
  <script src="../../js/components/AuthHeader.js"></script>
  <script src="../../js/utils/click-limiter.js"></script>
  <script src="../../js/pages/register.js"></script>
</body>
</html>
