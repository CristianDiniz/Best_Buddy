<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Best Buddy — Esqueci minha senha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="../../css/tailwind.build.css" />
</head>
<body>
  <div class="bb-auth-shell">
    <div id="bb-header"></div>

    <main class="bb-container">
      <div class="bb-card bb-auth-card">
        <h1 class="bb-auth-subtitle">Esqueci minha senha</h1>

        <div id="bb-form-alert"></div>

        <!-- Passo 1: informar email -->
        <form id="bb-request-form" novalidate>
          <div class="bb-field">
            <label class="bb-label" for="email">Email</label>
            <input class="bb-input" type="email" id="email" name="email" placeholder="Informe seu email" required />
            <div class="bb-error-text" id="email-error"></div>
          </div>
          <button class="bb-btn bb-btn--primary bb-btn--block" type="submit" id="bb-request-btn">
            Enviar PIN
          </button>
        </form>

        <!-- Passo 2: confirmar PIN + nova senha (escondido até o passo 1 concluir) -->
        <form id="bb-confirm-form" novalidate class="hidden mt-6">
          <p class="text-ink-300 text-sm mb-4">
            Insira o PIN enviado ao seu email
          </p>
          <div class="bb-field">
            <label class="bb-label" for="pin">PIN</label>
            <input class="bb-input" type="text" id="pin" name="pin" placeholder="000000" required />
            <div class="bb-error-text" id="pin-error"></div>
          </div>
          <div class="bb-field">
            <label class="bb-label" for="nova-senha">Nova senha</label>
            <input class="bb-input" type="password" id="nova-senha" name="nova_senha" placeholder="Mínimo 6 caracteres" required />
            <div class="bb-error-text" id="nova-senha-error"></div>
          </div>
          <button class="bb-btn bb-btn--primary bb-btn--block" type="submit" id="bb-confirm-btn">
            Redefinir senha
          </button>
        </form>

        <div class="bb-auth-footer-link">
          <a href="login.html">Voltar à tela de login</a>
        </div>
      </div>
    </main>

    <div id="bb-footer"></div>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/utils/storage.js"></script>
  <script src="../../js/utils/validation.js"></script>
  <script src="../../js/mocks/mock-utils.js"></script>
  <script src="../../js/mocks/mock-data.js"></script>
  <script src="../../js/api/client.js"></script>
  <script src="../../js/services/authService.js"></script>
  <script src="../../js/utils/header-scroll.js"></script>
  <script src="../../js/components/AuthHeader.js"></script>
  <script src="../../js/components/Footer.js"></script>
  <script src="../../js/components/NearbyOngsMap.js"></script>
  <script src="../../js/pages/forgot-password.js"></script>
</body>
</html>
